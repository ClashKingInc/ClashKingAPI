name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript Worker and packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci --strict-peer-deps

      - name: Require a new unused API package version
        if: github.event_name == 'pull_request'
        run: node scripts/api-release-version.mjs check-pr "origin/${{ github.base_ref }}"

      - name: Validate contracts, client, and Worker
        run: |
          npm run typecheck
          npm run lint
          npm run openapi:check
          npm run build

      - name: Check out canonical schema fixture
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ClashKingInc/DevKit
          ref: cca392cbdc90ff61bcb2ec916f42f9edf056055f
          path: .ci-schema
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26'
          cache: false

      - name: Install canonical schema migrator
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.26.0

      - name: Check out pinned static asset fixture
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ClashKingInc/ClashKingAssets
          ref: 82887e25ff520a522d5d673619a9277f276a3327
          path: .ci-assets
          persist-credentials: false

      # The old Worker must create a real multi-page operation before Goose
      # changes its settings. The current Worker must then finish that operation.
      - name: Check out previous ticket Worker
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 089455b566265ea4f772e3eebff30fbfdeb77b9e
          path: .ci-previous-api
          persist-credentials: false

      - name: Build previous ticket Worker contracts
        working-directory: .ci-previous-api
        run: |
          npm ci --strict-peer-deps
          npm run build --workspace @clashking/api-contracts
          npm run build --workspace @clashking/api-client

      - name: Verify ticket migration and active operation continuation
        env:
          CLASHKING_E2E_PREVIOUS_API_REPO: ${{ github.workspace }}/.ci-previous-api
          CLASHKING_TICKET_MIGRATION_PATH: ${{ github.workspace }}/.ci-schema/database/timescale/081_current_ticket_settings.sql
          CLASHKING_LAB_MIGRATION_PATH: ${{ github.workspace }}/.ci-schema/database/timescale/082_server_lab_tenure.sql
          CLASHKING_LOCAL_STATIC_ASSETS_ROOT: ${{ github.workspace }}/.ci-assets/assets/static_data
          WRANGLER_LOG_PATH: ${{ runner.temp }}/ticket-migration-wrangler.log
        run: bash .ci-schema/scripts/with-test-timescale.sh --profile baseline-079 -- node scripts/e2e/ticket-current-settings.mjs

      - name: Verify Legend performance API against disposable Timescale
        env:
          CLASHKING_E2E_STATIC_ASSETS_ROOT: ${{ github.workspace }}/.ci-assets/assets/static_data
        run: bash .ci-schema/scripts/with-test-integration.sh --profile retained-api -- node scripts/e2e/legend-day-performance.mjs

      - name: Verify SDK-backed Discord authentication and provider paths
        env:
          CLASHKING_E2E_STATIC_ASSETS_ROOT: ${{ github.workspace }}/.ci-assets/assets/static_data
          CLASHKING_E2E_SCHEMA_ROOT: ${{ github.workspace }}/.ci-schema
        run: bash .ci-schema/scripts/with-test-integration.sh --profile retained-api -- node scripts/e2e/legend-day-performance.mjs --discord-contract-only

      - name: Verify upstream Clash HTTP outcomes and removed migration route
        run: bash .ci-schema/scripts/with-test-integration.sh --profile retained-api -- node scripts/e2e/clash-http-outcomes.mjs
      - name: Verify tracked clan Links cache and API fallback
        run: bash .ci-schema/scripts/with-test-integration.sh --profile retained-api -- node scripts/e2e/run-clan-links.mjs

      - name: Verify read-only army previews
        env:
          CLASHKING_E2E_STATIC_ASSETS_ROOT: ${{ github.workspace }}/.ci-assets/assets/static_data
        run: bash .ci-schema/scripts/with-test-integration.sh --profile retained-api -- node scripts/e2e/army-link-preview.mjs

      - name: Verify Bot personal suggestions and shared search history
        env:
          CLASHKING_E2E_STATIC_ASSETS_ROOT: ${{ github.workspace }}/.ci-assets/assets/static_data
        run: bash .ci-schema/scripts/with-test-timescale.sh --profile retained-api -- node scripts/e2e/bot-search-suggestions.mjs
      - name: Verify setup access and bounded War statistics
        env:
          CLASHKING_E2E_STATIC_ASSETS_ROOT: ${{ github.workspace }}/.ci-assets/assets/static_data
        run: bash .ci-schema/scripts/with-test-timescale.sh --profile retained-api -- node scripts/e2e/stats-and-setup.mjs

      - name: Verify player season contribution totals
        env:
          CLASHKING_E2E_STATIC_ASSETS_ROOT: ${{ github.workspace }}/.ci-assets/assets/static_data
        run: bash .ci-schema/scripts/with-test-timescale.sh --profile retained-api -- node scripts/e2e/player-season-stats.mjs

      - name: Verify countdown lifecycle against disposable Timescale
        env:
          CLASHKING_E2E_STATIC_ASSETS_ROOT: ${{ github.workspace }}/.ci-assets/assets/static_data
        run: bash .ci-schema/scripts/with-test-integration.sh --profile retained-api -- node scripts/e2e/countdown-lifecycle.mjs

      - name: Verify search against real local Elasticsearch
        env:
          CLASHKING_E2E_STATIC_ASSETS_ROOT: ${{ github.workspace }}/.ci-assets/assets/static_data
          CLASHKING_E2E_SCHEMA_ROOT: ${{ github.workspace }}/.ci-schema
        run: bash .ci-schema/scripts/with-test-timescale.sh --profile retained-api -- node scripts/e2e/search-nullability.mjs
