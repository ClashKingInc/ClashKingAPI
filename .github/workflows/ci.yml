name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript Worker and packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci --strict-peer-deps

      - name: Require a new unused API package version
        if: github.event_name == 'pull_request'
        run: node scripts/api-release-version.mjs check-pr "origin/${{ github.base_ref }}"

      - name: Validate contracts, client, and Worker
        run: |
          npm run typecheck
          npm run lint
          npm run openapi:check
          npm run build

      - name: Check out canonical schema fixture
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ClashKingInc/DevKit
          ref: c597f420aa00cdc19eccbddf992713a929f582d2
          path: .ci-schema
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26'
          cache: false

      - name: Install canonical schema migrator
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.26.0

      - name: Verify Legend performance API against disposable Timescale
        run: bash .ci-schema/scripts/with-test-integration.sh --profile retained-api -- node scripts/e2e/legend-day-performance.mjs
