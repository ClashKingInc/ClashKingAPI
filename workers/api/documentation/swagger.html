<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Swagger UI</title>
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,700|Source+Code+Pro:300,600|Titillium+Web:400,600,700" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.32.11/swagger-ui.css" >
  <style>
    html
    {
        box-sizing: border-box;
        overflow: -moz-scrollbars-vertical;
        overflow-y: scroll;
    }
    *,
    *:before,
    *:after
    {
        box-sizing: inherit;
    }

    body {
      margin:0;
      background: #fafafa;
    }
  </style>
</head>

<body>

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="position:absolute;width:0;height:0">
  <defs>
    <symbol viewBox="0 0 20 20" id="unlocked">
          <path d="M15.8 8H14V5.6C14 2.703 12.665 1 10 1 7.334 1 6 2.703 6 5.6V6h2v-.801C8 3.754 8.797 3 10 3c1.203 0 2 .754 2 2.199V8H4c-.553 0-1 .646-1 1.199V17c0 .549.428 1.139.951 1.307l1.197.387C5.672 18.861 6.55 19 7.1 19h5.8c.549 0 1.428-.139 1.951-.307l1.196-.387c.524-.167.953-.757.953-1.306V9.199C17 8.646 16.352 8 15.8 8z"></path>
    </symbol>

    <symbol viewBox="0 0 20 20" id="locked">
      <path d="M15.8 8H14V5.6C14 2.703 12.665 1 10 1 7.334 1 6 2.703 6 5.6V8H4c-.553 0-1 .646-1 1.199V17c0 .549.428 1.139.951 1.307l1.197.387C5.672 18.861 6.55 19 7.1 19h5.8c.549 0 1.428-.139 1.951-.307l1.196-.387c.524-.167.953-.757.953-1.306V9.199C17 8.646 16.352 8 15.8 8zM12 8H8V5.199C8 3.754 8.797 3 10 3c1.203 0 2 .754 2 2.199V8z"/>
    </symbol>
  </defs>
</svg>

<div id="swagger-ui"></div>

<script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.32.11/swagger-ui-bundle.js"> </script>
<script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.32.11/swagger-ui-standalone-preset.js"> </script>
<script>
window.onload = function() {
  const tagOrder = [
    "Player", "Clan", "War & CWL", "Leaderboard", "Counts", "Stats", "Search", "Dates", "Links"
  ];
  const ui = SwaggerUIBundle({
    url: "/openapi.json",
    deepLinking: true,
    docExpansion: "list",
    dom_id: "#swagger-ui",
    persistAuthorization: false,
    validatorUrl: null,
    tagsSorter: function(a, b) {
      const ai = tagOrder.indexOf(a);
      const bi = tagOrder.indexOf(b);
      if (ai !== -1 || bi !== -1) {
        return (ai === -1 ? tagOrder.length : ai) - (bi === -1 ? tagOrder.length : bi);
      }
      return a.localeCompare(b);
    },
    operationsSorter: function(a, b) {
      function pathRank(path, method) {
        const key = method.toUpperCase() + " " + path.replace(/\{[^}]+\}/g, "{}");
        const ranks = {
          "GET /v2/links/{}": 0,
          "POST /v2/links/{}": 1,
          "PUT /v2/links/{}/order": 2,
          "DELETE /v2/links/{}/{}": 3,
          "GET /v2/links/{}/bookmarks": 4,
          "POST /v2/links/{}/bookmarks": 5,
          "PUT /v2/links/{}/bookmarks/order": 6,
          "DELETE /v2/links/{}/bookmarks/{}/{}": 7,
          "GET /v2/links/{}/searches": 8
        };
        return Object.prototype.hasOwnProperty.call(ranks, key) ? ranks[key] : null;
      }
      const ap = a.get("path");
      const bp = b.get("path");
      const am = a.get("method");
      const bm = b.get("method");
      const ar = pathRank(ap, am);
      const br = pathRank(bp, bm);
      if (ar !== null || br !== null) {
        return (ar === null ? Number.MAX_SAFE_INTEGER : ar) - (br === null ? Number.MAX_SAFE_INTEGER : br);
      }
      const pathCompare = ap.localeCompare(bp);
      if (pathCompare !== 0) {
        return pathCompare;
      }
      return am.localeCompare(bm);
    },
    presets: [
      SwaggerUIBundle.presets.apis,
      SwaggerUIStandalonePreset
    ],
    plugins: [
      SwaggerUIBundle.plugins.DownloadUrl
    ],
    layout: "StandaloneLayout"
  })
  window.ui = ui
}
</script>
</body>
</html>
