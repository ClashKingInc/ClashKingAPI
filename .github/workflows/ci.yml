name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript Worker and packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci --strict-peer-deps

      - name: Require a new unused API package version
        if: github.event_name == 'pull_request'
        run: node scripts/api-release-version.mjs check-pr "origin/${{ github.base_ref }}"

      - name: Validate contracts, client, and Worker
        run: |
          npm run typecheck
          npm run lint
          npm run openapi:check
          npm run build
